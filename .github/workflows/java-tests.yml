name: Java MVC and Validation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application and tests
        run: javac -d out model/*.java controller/*.java view/*.java *.java
      - name: Run model validation regression tests
        run: java -cp out ValidationTests
      - name: Run MVC integration tests
        run: java -cp out MvcIntegrationTests
      - name: Verify application starts
        run: printf '4\n' | java -cp out Main
